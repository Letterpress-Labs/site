<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoDesk - Letterpress Labs</title>
    <meta name="description" content="PhotoDesk by Letterpress Labs.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #1a1f2e;
            --cream: #f0e6d3;
            --olive: #5a6b3c;
            --muted: #8a8d7b;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--navy);
            color: var(--cream);
            font-family: 'Libre Caslon Text', 'Caslon', Georgia, serif;
            display: flex;
            flex-direction: column;
        }

        a { color: var(--cream); text-decoration: none; }

        nav {
            padding: 1.2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            flex-shrink: 0;
        }

        nav a { opacity: 0.5; transition: opacity 0.2s; }
        nav a:hover { opacity: 1; }
        nav .active { opacity: 1; }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6rem 1rem;
            min-height: 0;
        }

        .product {
            display: flex;
            align-items: center;
            gap: 4rem;
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        /* Gallery */
        .gallery {
            flex: 1;
            min-width: 0;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            color: var(--cream);
            opacity: 0;
            cursor: pointer;
            transition: opacity 0.2s;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0.5rem;
            z-index: 2;
            line-height: 1;
        }

        .gallery:hover .gallery-nav { opacity: 0.3; }
        .gallery-nav:hover { opacity: 0.8 !important; }
        .gallery-prev { left: -2.5rem; }
        .gallery-next { right: -2.5rem; }

        .gallery-image {
            width: 100%;
            border-radius: 8px;
            display: block;
            object-fit: contain;
            max-height: 100%;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .gallery-image.active {
            opacity: 1;
        }


        .product .info {
            flex: 0 0 200px;
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .info .icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
        }

        .info h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        .info p {
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .download-btn {
            font-family: 'Libre Caslon Text', 'Caslon', Georgia, serif;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: var(--cream);
            border-bottom: 1px solid var(--olive);
            padding-bottom: 2px;
            transition: border-color 0.2s;
        }

        .download-btn:hover {
            border-color: var(--cream);
        }

        footer {
            padding: 1rem 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            opacity: 0.4;
            flex-shrink: 0;
        }

        /* Fullscreen lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(10, 12, 18, 0.97);
            overflow: auto;
            cursor: pointer;
        }

        .lightbox.open {
            display: block;
        }

        .lightbox img {
            border-radius: 6px;
            display: block;
            margin: 2rem auto;
        }

        .lightbox-close {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            font-size: 1.5rem;
            color: var(--cream);
            opacity: 0.4;
            cursor: pointer;
            transition: opacity 0.2s;
            background: none;
            border: none;
            font-family: inherit;
        }

        .lightbox-close:hover { opacity: 1; }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: var(--cream);
            opacity: 0.3;
            cursor: pointer;
            transition: opacity 0.2s;
            background: none;
            border: none;
            font-family: inherit;
            padding: 1rem;
        }

        .lightbox-nav:hover { opacity: 0.8; }
        .lightbox-prev { left: 1rem; }
        .lightbox-next { right: 1rem; }


        @media (max-width: 768px) {
            html, body { height: auto; overflow: auto; }
            nav { padding: 1.5rem; }
            main { padding: 2rem 1.5rem; }

            .product {
                flex-direction: column;
                gap: 2rem;
                text-align: center;
            }

            .gallery { height: auto; }
            .product .info { width: 100%; max-width: none; }
            .info h1 { font-size: 1.3rem; }
            .info .icon { width: 40px; height: 40px; }
            footer { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/">letterpress labs</a>
        <a href="/products" class="active">products</a>
    </nav>

    <main>
        <div class="product">
            <div class="gallery" id="gallery">
                <img class="gallery-image active" src="/products/photodesk/screenshots/import.png" alt="Import" data-label="import">
                <img class="gallery-image" src="/products/photodesk/screenshots/library.png" alt="Library" data-label="library" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;">
                <img class="gallery-image" src="/products/photodesk/screenshots/develop.png" alt="Develop" data-label="develop" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;">
                <img class="gallery-image" src="/products/photodesk/screenshots/export.png" alt="Export" data-label="export" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;">
                <img class="gallery-image" src="/products/photodesk/screenshots/tether.png" alt="Tether" data-label="tether" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;">
                <button class="gallery-nav gallery-prev" id="galleryPrev">&#8249;</button>
                <button class="gallery-nav gallery-next" id="galleryNext">&#8250;</button>
            </div>
            <div class="info">
                <div class="info-header">
                    <img src="/products/photodesk/logo-1024.png" alt="PhotoDesk" class="icon">
                    <h1>PhotoDesk</h1>
                </div>
                <p>A desktop application for organizing, editing, and managing your photo library with a clean, focused workflow.</p>
                <a href="/products/photodesk/PhotoDesk-v1.dmg" class="download-btn" download>Download for Mac — v1</a>
            </div>
        </div>
    </main>

    <footer>Proudly made in Canada &middot; &copy; 2025 Letterpress Labs</footer>

    <!-- Fullscreen lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#8249;</button>
        <button class="lightbox-nav lightbox-next" id="lightboxNext">&#8250;</button>
        <img id="lightboxImg" src="" alt="">
    </div>

    <script>
        const images = document.querySelectorAll('.gallery-image');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        let current = 0;

        function goTo(idx) {
            images[current].classList.remove('active');
            current = idx;
            images[current].classList.add('active');
            if (lightbox.classList.contains('open')) {
                lightboxImg.src = images[current].src;
            }
        }

        function next() { goTo((current + 1) % images.length); }
        function prev() { goTo((current - 1 + images.length) % images.length); }

        // Gallery carets
        document.getElementById('galleryPrev').addEventListener('click', e => { e.stopPropagation(); prev(); });
        document.getElementById('galleryNext').addEventListener('click', e => { e.stopPropagation(); next(); });

        // Gallery click opens lightbox
        document.getElementById('gallery').addEventListener('click', (e) => {
            if (e.target.closest('.gallery-nav')) return;
            lightboxImg.src = images[current].src;
            lightbox.classList.add('open');
        });

        // Lightbox close
        document.getElementById('lightboxClose').addEventListener('click', e => {
            e.stopPropagation();
            lightbox.classList.remove('open');
        });

        // Click lightbox background to close
        lightbox.addEventListener('click', e => {
            if (e.target === lightbox || e.target === lightboxImg) {
                lightbox.classList.remove('open');
            }
        });

        // Lightbox nav
        document.getElementById('lightboxPrev').addEventListener('click', e => { e.stopPropagation(); prev(); });
        document.getElementById('lightboxNext').addEventListener('click', e => { e.stopPropagation(); next(); });

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && lightbox.classList.contains('open')) {
                lightbox.classList.remove('open');
            }
            if (e.key === 'ArrowRight') next();
            if (e.key === 'ArrowLeft') prev();
        });
    </script>

</body>
</html>
