<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoDesk - Letterpress Labs</title>
    <meta name="description" content="PhotoDesk by Letterpress Labs.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #1a1f2e;
            --cream: #f0e6d3;
            --olive: #5a6b3c;
            --muted: #8a8d7b;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--navy);
            color: var(--cream);
            font-family: 'Libre Caslon Text', 'Caslon', Georgia, serif;
            display: flex;
            flex-direction: column;
        }

        a { color: var(--cream); text-decoration: none; }

        nav {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            flex-shrink: 0;
        }

        nav a { opacity: 0.5; transition: opacity 0.2s; }
        nav a:hover { opacity: 1; }
        nav .active { opacity: 1; }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4rem 2rem;
            min-height: 0;
        }

        .product {
            display: flex;
            align-items: center;
            gap: 4rem;
            max-width: 1200px;
            width: 100%;
        }

        .product .screenshot {
            flex: 3;
            min-width: 0;
        }

        .product .screenshot img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }

        .product .info {
            flex: 1;
            min-width: 200px;
            max-width: 240px;
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .info .icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
        }

        .info h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        .info p {
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .download-btn {
            font-family: 'Libre Caslon Text', 'Caslon', Georgia, serif;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: var(--cream);
            border-bottom: 1px solid var(--olive);
            padding-bottom: 2px;
            transition: border-color 0.2s;
        }

        .download-btn:hover {
            border-color: var(--cream);
        }

        footer {
            padding: 1rem 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            opacity: 0.4;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            html, body { height: auto; overflow: auto; }
            nav { padding: 1.5rem; }
            main { padding: 2rem 1.5rem; }

            .product {
                flex-direction: column;
                gap: 2rem;
                text-align: center;
            }

            .product .info { width: 100%; }
            .info h1 { font-size: 1.3rem; }
            .info .icon { width: 40px; height: 40px; }
            footer { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/">letterpress labs</a>
        <a href="/products" class="active">products</a>
    </nav>

    <main>
        <div class="product">
            <div class="screenshot">
                <img src="/products/photodesk/photodesk.png" alt="PhotoDesk screenshot">
            </div>
            <div class="info">
                <div class="info-header">
                    <img src="/products/photodesk/logo-1024.png" alt="PhotoDesk" class="icon">
                    <h1>PhotoDesk</h1>
                </div>
                <p>A desktop application for organizing, editing, and managing your photo library with a clean, focused workflow.</p>
                <a href="/products/photodesk/PhotoDesk.dmg" class="download-btn" download>Download for Mac</a>
            </div>
        </div>
    </main>

    <footer>Proudly made in Canada &middot; &copy; 2025 Letterpress Labs</footer>

</body>
</html>
