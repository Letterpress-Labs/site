<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — Letterpress Labs</title>
    <meta name="description" content="Software products by Letterpress Labs.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #1a1f2e;
            --cream: #f0e6d3;
            --olive: #5a6b3c;
            --muted: #8a8d7b;
        }

        body {
            background: var(--navy);
            color: var(--cream);
            font-family: 'Libre Caslon Text', 'Caslon', Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: var(--cream); text-decoration: none; }

        nav {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
        }

        nav a { opacity: 0.5; transition: opacity 0.2s; }
        nav a:hover, nav a.active { opacity: 1; }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
        }

        .product-page {
            max-width: 680px;
            width: 100%;
            text-align: center;
        }

        .product-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.4rem;
        }

        .product-header img {
            width: 48px;
            height: 48px;
            border-radius: 11px;
        }

        .product-header h1 {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        .product-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--olive);
            margin-bottom: 2.5rem;
        }

        .screenshot {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 2.5rem;
        }

        .product-desc {
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--muted);
            max-width: 480px;
            margin: 0 auto 2.5rem;
        }

        .download-btn {
            display: inline-block;
            font-family: 'Libre Caslon Text', 'Caslon', Georgia, serif;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: var(--cream);
            border-bottom: 1px solid var(--olive);
            padding-bottom: 2px;
            transition: border-color 0.2s;
        }

        .download-btn:hover {
            border-color: var(--cream);
        }

        footer {
            padding: 2rem 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            opacity: 0.4;
        }

        @media (max-width: 600px) {
            nav { padding: 1.5rem; }
            main { padding: 3rem 1.5rem; }
            .product-header h1 { font-size: 1.3rem; }
            .product-header img { width: 40px; height: 40px; }
            footer { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/">letterpress labs</a>
        <a href="/products" class="active">products</a>
    </nav>

    <main>
        <div class="product-page">
            <div class="product-header">
                <img src="logo-1024.png" alt="PhotoDesk icon">
                <h1>PhotoDesk</h1>
            </div>
            <p class="product-category">photo editing</p>

            <img src="photodesk.png" alt="PhotoDesk screenshot" class="screenshot">

            <p class="product-desc">A desktop application for organizing, editing, and managing your photo library with a clean, focused workflow.</p>

            <a href="PhotoDesk.dmg" class="download-btn" download>Download for Mac</a>
        </div>
    </main>

    <footer>&copy; 2025 Letterpress Labs</footer>

</body>
</html>
