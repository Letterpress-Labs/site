<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — Letterpress Labs</title>
    <meta name="description" content="Software products by Letterpress Labs.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #1a1f2e;
            --cream: #f0e6d3;
            --olive: #5a6b3c;
            --muted: #8a8d7b;
        }

        body {
            background: var(--navy);
            color: var(--cream);
            font-family: 'Libre Caslon Text', 'Caslon', Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- NAV --- */
        nav {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: var(--cream);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 1;
        }

        nav a.active {
            opacity: 1;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        /* --- MAIN --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .products {
            max-width: 520px;
            width: 100%;
        }

        .page-title {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: lowercase;
            margin-bottom: 3rem;
            text-align: center;
        }

        /* --- PRODUCT CARD --- */
        .product {
            border: 1px solid rgba(240, 230, 211, 0.1);
            padding: 2.5rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .product h2 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: lowercase;
            margin-bottom: 0.5rem;
        }

        .product .category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--olive);
            margin-bottom: 1.2rem;
        }

        .product p {
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        .product .status {
            font-size: 0.75rem;
            font-style: italic;
            color: var(--muted);
            opacity: 0.7;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: var(--olive);
            margin: 1.2rem auto;
        }

        /* --- FOOTER --- */
        footer {
            padding: 2rem 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            opacity: 0.5;
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            nav {
                padding: 1.5rem 1.5rem;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .product {
                padding: 2rem 1.5rem;
            }

            footer {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/">letterpress labs</a>
        <div class="nav-links">
            <a href="/products" class="active">products</a>
        </div>
    </nav>

    <main>
        <div class="products">
            <h1 class="page-title">products</h1>

            <div class="product">
                <h2>PhotoDesk</h2>
                <p class="category">photography</p>
                <div class="divider"></div>
                <p>A desktop application for organizing, editing, and managing your photo library with a clean, focused workflow.</p>
                <span class="status">coming soon</span>
            </div>

        </div>
    </main>

    <footer>
        <a href="/">&copy; 2025 Letterpress Labs</a>
    </footer>

</body>
</html>
