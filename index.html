<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterpress Labs</title>
    <meta name="description" content="Letterpress Labs — Software development studio.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #1a1f2e;
            --cream: #f0e6d3;
            --olive: #5a6b3c;
            --muted: #8a8d7b;
        }

        body {
            background: var(--navy);
            color: var(--cream);
            font-family: 'Libre Caslon Text', 'Caslon', Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: var(--cream); text-decoration: none; }

        nav {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
        }

        nav a { opacity: 0.5; transition: opacity 0.2s; }
        nav a:hover { opacity: 1; }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .hero {
            display: flex;
            align-items: center;
            gap: 3rem;
        }

        .hero img {
            width: 120px;
            height: auto;
        }

        .hero-text h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            margin-bottom: 0.3rem;
        }

        .hero-text .tagline {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--muted);
        }

        .hero-text .email {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
        }

        .hero-text .email a {
            color: var(--muted);
            border-bottom: 1px solid var(--olive);
            padding-bottom: 1px;
            transition: color 0.2s;
        }

        .hero-text .email a:hover {
            color: var(--cream);
        }

        footer {
            padding: 2rem 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            opacity: 0.4;
        }

        @media (max-width: 600px) {
            nav { padding: 1.5rem; }

            .hero {
                flex-direction: column;
                text-align: center;
                gap: 2rem;
            }

            .hero img { width: 100px; }
            .hero-text h1 { font-size: 1.4rem; }
            footer { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/">letterpress labs</a>
        <a href="/products">products</a>
    </nav>

    <main>
        <div class="hero">
            <img src="logo.png" alt="Letterpress Labs">
            <div class="hero-text">
                <h1>Letterpress Labs</h1>
                <p class="tagline">software development studio</p>
                <p class="email"><a href="mailto:hello@letterpresslabs.com">hello@letterpresslabs.com</a></p>
            </div>
        </div>
    </main>

    <footer>Proudly made in Canada &middot; &copy; 2025 Letterpress Labs</footer>

</body>
</html>
